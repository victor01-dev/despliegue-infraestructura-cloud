version: "3.9"

services:
  web:
    image: nginx:alpine
    container_name: nginx-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
      - nginx-logs:/var/log/nginx
    environment:
      - TZ=Europe/Madrid

volumes:
  nginx-logs:
    driver: local
